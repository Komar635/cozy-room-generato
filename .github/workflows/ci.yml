name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/reality_digitizer_3d
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-do-not-use-in-production
      AUTH_PROVIDER: local
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci-minio-access-key
      MINIO_SECRET_KEY: ci-minio-secret-key
      MINIO_BUCKET_NAME: reality-digitizer-3d-ci
      GEMINI_API_KEY: ci-placeholder
      PHOTOGRAMMETRY_SERVICE_URL: http://localhost:8001
      MODIFICATION_SERVICE_URL: http://localhost:8002
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS: "false"
      NEXT_PUBLIC_ENABLE_LOGROCKET: "false"
      NEXT_PUBLIC_ENABLE_SENTRY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run biome .

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and property tests
        run: bun test

      - name: Production build smoke test
        run: bun run build
