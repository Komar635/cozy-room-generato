name: Vercel Preview Preparation

on:
  pull_request:

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate Vercel deployment inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secret configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name is not configured; preview deployment is skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 0
          fi
          echo "Vercel secrets are present. Enable the deployment step intentionally when ready."

      # Deployment is intentionally not executed in this repository preparation task.
      # To enable it later, add Vercel CLI deployment after CI passes and configure secrets in GitHub.
